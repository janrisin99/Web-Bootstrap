<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>


<body>
        <!-- MENU -->
    <div id="menu-container"></div>
        <div class="container">

    <div class="container">
        <!--content-->
        <h3 class="alert alert-success mt-4">หน้าหลัก</h3>
        <div class="alert alert-primary text-center" role="alert">
            Atian Janrisil
        </div>

        <div class="text-end mb-4">
        <a class="btn btn-info" href="//https://www.google.com">google</a>
        </div><!--endcontainer -->
        <br>

        <!-- แบ่งคอลัมน์ด้วย Grid -->
        <div class="container text-end mb-4">
            <div class="row">
            <div class="col-sm-4 bg-danger-subtle">
                <img src="img web/1200.jpg" width="100%">
                Bird
            </div>

            <div class="col-sm-4 bg-warning-subtle">
                <img src="img web/iStock-997048534.jpg" width="95%">
                Eagle
            </div>

            <div class="col-sm-4 bg-primary-subtle" width="100%">
                 <h4>Login</h4>
           
                <form class="text-start">
                    <div class="mb-3">
                      <label class="form-label">Firstname</label>
                      <input type="text" class="form-control" id="Firstname" required placeholder="input Firstname" >
                    </div>

                    <div class="mb-3">
                      <label class="form-label">Lastname</label>
                      <input type="text" class="form-control" id="Lastname" required placeholder="input Lastname">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Telephone</label>
                        <input type="phone" class="form-control" id="Number" required placeholder="ex.xxx-xxx-xxxx">
                      </div>
                    
                      <div class="mb-3">
                      <label class="form-label">City</label>
                      <select class="form-select" aria-label="Default select example">
                        <option selected>Select your city</option>
                        <option value="1">Rayong</option>
                        <option value="2">Chonburi</option>
                        <option value="3">Bangkok</option>
                      </select>
                      </div>

                      <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="Email Address" required placeholder="input email">
                      </div>

                      <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="pw" required placeholder="input password">
                      </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary">Submit</button>
                        <button type="submit" class="btn btn-secondary">Cancel</button>
                     

            </div>
          </div>
        </div>
</body>
</html>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/menu.js"></script>
